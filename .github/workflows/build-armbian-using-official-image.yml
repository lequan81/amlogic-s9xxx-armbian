name: Build Armbian from official images

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      armbian_release:
        description: "Select Armbian base release."
        required: false
        default: "bookworm"
        type: choice
        options:
          - bookworm
          - trixie
          - noble
          - resolute
      armbian_board:
        description: "Select device board."
        required: false
        default: "mytv-net1"
        type: string
      armbian_kernel:
        description: "Select kernel version."
        required: false
        default: "6.1.y"
        type: choice
        options:
          - 6.1.y
          - 6.6.y
          - 6.12.y
          - 6.18.y
      auto_kernel:
        description: "Auto use the latest kernel."
        required: false
        default: true
        type: boolean
      armbian_edition:
        description: "Select image edition type."
        required: false
        default: "server"
        type: choice
        options:
          - server
          - desktop

env:
  TZ: Etc/UTC

jobs:
  build:
    runs-on: ubuntu-24.04
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize the build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install curl jq btrfs-progs xfsprogs dosfstools p7zip-full pigz
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create virtual disk for extended storage
        id: disk
        run: |
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: Insufficient space"; exit 1; }

          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Set Armbian download source
        id: down
        working-directory: /builder
        run: |
          # Query image directly from official Armbian server
          armbian_site="https://dl.armbian.com/odroidn2/archive/"
          release_target="${{ inputs.armbian_release }}"
          
          armbian_file=$(curl -sL "${armbian_site}" | grep -oE "Armbian_[0-9\._]+_Odroidn2_${release_target}_[^\"']+\.img\.xz" | head -n 1)
          
          if [[ -z "${armbian_file}" ]]; then
              echo "Error: No official base image found for ${release_target} on ${armbian_site}"
              exit 1
          fi
          
          armbian_url="${armbian_site}${armbian_file}"
          echo "ARMBIAN_URL=${armbian_url}" >> ${GITHUB_ENV}
          echo "build_tag=Armbian_${release_target}_arm64_${{ inputs.armbian_edition }}_$(date +'%Y.%m.%d')" >> ${GITHUB_ENV}

          mkdir -p /builder/build
          ln -sf /builder/build ${{ github.workspace }}/build
          mkdir -p /home/runner/work/_actions/ophub/amlogic-s9xxx-armbian/main
          ln -sf /builder/build /home/runner/work/_actions/ophub/amlogic-s9xxx-armbian/main/build

          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Rebuild Armbian for target boards
        uses: ./
        if: ${{ env.ARMBIAN_URL != '' && !cancelled() }}
        with:
          build_target: armbian
          armbian_files: build-armbian/armbian-files
          armbian_path: ${{ env.ARMBIAN_URL }}
          armbian_board: ${{ inputs.armbian_board }}
          armbian_kernel: ${{ inputs.armbian_kernel }}
          auto_kernel: ${{ inputs.auto_kernel }}

      - name: Upload Armbian images to Release
        uses: ophub/upload-to-releases@main
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: ${{ env.build_tag }}
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allow_updates: true
          replaces_artifacts: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Armbian images to Artifacts
        uses: actions/upload-artifact@v4
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          name: ${{ env.build_tag }}
          path: ${{ env.PACKAGED_OUTPUTPATH }}/*
          retention-days: 7
