name: Build MyTV Net 1 kernel and DTB

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: Branch, tag, or commit in the personal RK3528 kernel fork
        required: true
        default: dev-mytv-net1
        type: string
      kernel_defconfig:
        description: ARM64 kernel defconfig
        required: true
        default: rockchip_linux_defconfig
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MyTV Net 1 kernel fork
        uses: actions/checkout@v6
        with:
          repository: lequan81/linux-6.1.y-rockchip
          ref: ${{ inputs.kernel_ref }}
          path: kernel
          persist-credentials: false

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential dwarves flex gcc-aarch64-linux-gnu kmod \
            libelf-dev libncurses-dev libssl-dev device-tree-compiler

      - name: Configure and build kernel, modules, and MyTV Net 1 DTB
        shell: bash
        env:
          KERNEL_DEFCONFIG: ${{ inputs.kernel_defconfig }}
        run: |
          set -euo pipefail
          [[ "$KERNEL_DEFCONFIG" =~ ^[A-Za-z0-9_]+$ ]] || {
            echo "Invalid kernel defconfig name" >&2
            exit 1
          }
          src="$GITHUB_WORKSPACE/kernel"
          out="$RUNNER_TEMP/kernel-out"
          stage="$RUNNER_TEMP/kernel-artifacts"
          cross="aarch64-linux-gnu-"

          make -C "$src" O="$out" ARCH=arm64 CROSS_COMPILE="$cross" \
            "$KERNEL_DEFCONFIG"
          "$src/scripts/config" --file "$out/.config" \
            --enable EXPERT \
            --enable GPIOLIB \
            --enable GPIO_SYSFS
          make -C "$src" O="$out" ARCH=arm64 CROSS_COMPILE="$cross" olddefconfig
          grep -q '^CONFIG_GPIO_SYSFS=y$' "$out/.config" || {
            echo "GPIO sysfs support is required for the verified FD655 panel driver" >&2
            exit 1
          }

          make -C "$src" O="$out" ARCH=arm64 CROSS_COMPILE="$cross" \
            -j"$(nproc)" Image modules rockchip/rk3528-mytv-net1.dtb

          release="$(make -s -C "$src" O="$out" ARCH=arm64 \
            CROSS_COMPILE="$cross" kernelrelease)"
          install_root="$RUNNER_TEMP/modules-root"
          make -C "$src" O="$out" ARCH=arm64 CROSS_COMPILE="$cross" \
            INSTALL_MOD_PATH="$install_root" modules_install
          depmod -b "$install_root" "$release"

          mkdir -p "$stage/boot/dtb/rockchip" "$stage/modules"
          install -m 0644 "$out/arch/arm64/boot/Image" "$stage/boot/Image"
          install -m 0644 \
            "$out/arch/arm64/boot/dts/rockchip/rk3528-mytv-net1.dtb" \
            "$stage/boot/dtb/rockchip/rk3528-mytv-net1.dtb"
          cp -a "$install_root/lib/modules/$release" "$stage/modules/"
          printf '%s\n' "$release" > "$stage/kernelrelease.txt"
          cp "$out/.config" "$stage/kernel.config"
          (
            cd "$stage"
            sha256sum boot/Image boot/dtb/rockchip/rk3528-mytv-net1.dtb \
              kernelrelease.txt kernel.config > SHA256SUMS
            tar -czf mytvnet1-modules.tar.gz modules
          )
          rm -rf "$stage/modules"
          echo "Built kernel release: $release"
          cat "$stage/SHA256SUMS"

      - name: Upload test kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: mytvnet1-kernel-${{ inputs.kernel_ref }}
          path: ${{ runner.temp }}/kernel-artifacts/
          if-no-files-found: error
          retention-days: 14
