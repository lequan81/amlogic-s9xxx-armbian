name: Cook MyTV Net 1 image variants

on:
  workflow_dispatch:
    inputs:
      base_image_url:
        description: Full-disk Armbian image with BOOT and ROOTFS partitions at the verified MyTV offsets
        required: true
        type: string
      kernel_run_id:
        description: Successful run ID from Build MyTV Net 1 kernel and DTB
        required: true
        type: string
      kernel_ref:
        description: Kernel artifact ref used in the kernel build workflow
        required: true
        default: dev-mytv-net1
        type: string

permissions:
  actions: read
  contents: read

jobs:
  cook:
    name: Cook ${{ matrix.variant }} image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant:
          - baseline
          - custom-kernel
          - diagnostics
    steps:
      - name: Checkout AML fork and verified bootloader files
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download custom kernel artifact
        if: matrix.variant != 'baseline'
        uses: actions/download-artifact@v4
        with:
          name: mytvnet1-kernel-${{ inputs.kernel_ref }}
          run-id: ${{ inputs.kernel_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/kernel-artifact

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binfmt-support curl file gcc-aarch64-linux-gnu gzip jq kmod \
            parted qemu-user-static u-boot-tools util-linux

      - name: Download and cook image
        shell: bash
        env:
          BASE_IMAGE_URL: ${{ inputs.base_image_url }}
          IMAGE_VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mytvnet1-image"
          kernel="$RUNNER_TEMP/kernel-artifact"
          bootloader="$GITHUB_WORKSPACE/test-assets/mytvnet1"
          mkdir -p "$work" "$work/mnt" "$work/bootmnt"

          curl --fail --location --retry 3 "$BASE_IMAGE_URL" -o "$work/base.download"
          if file "$work/base.download" | grep -qi 'gzip compressed'; then
            gzip -dc "$work/base.download" > "$work/Armbian_MyTV-Net1_${IMAGE_VARIANT}.img"
          else
            cp "$work/base.download" "$work/Armbian_MyTV-Net1_${IMAGE_VARIANT}.img"
          fi
          image="$work/Armbian_MyTV-Net1_${IMAGE_VARIANT}.img"

          idb="$bootloader/idbloader.img"
          fit="$bootloader/u-boot.itb"
          (cd "$bootloader" && sha256sum -c SHA256SUMS)
          test -s "$image"
          test -s "$idb"
          test -s "$fit"

          if [[ "$IMAGE_VARIANT" != "baseline" ]]; then
            (
              cd "$kernel"
              sha256sum -c SHA256SUMS
            )
            release="$(cat "$kernel/kernelrelease.txt")"
            test -s "$kernel/boot/Image"
            test -s "$kernel/boot/dtb/rockchip/rk3528-mytv-net1.dtb"
            test -s "$kernel/mytvnet1-modules.tar.gz"
          else
            release=""
          fi

          python3 - "$idb" "$fit" <<'PY'
          import pathlib, sys
          idb, fit = (pathlib.Path(p).read_bytes() for p in sys.argv[1:])
          if idb[:4] != b"RKNS":
              raise SystemExit("idbloader.img does not start with RKNS")
          if fit[:4] != bytes.fromhex("d00dfeed"):
              raise SystemExit("u-boot.itb is not a FIT image")
          if len(idb) > 8 * 1024 * 1024 - 32 * 1024:
              raise SystemExit("idbloader.img overlaps the U-Boot FIT slot")
          if len(fit) != 8 * 1024 * 1024:
              raise SystemExit("Expected the verified 8 MiB u-boot.itb slice")
          print(f"IDB loader: {len(idb)} bytes; FIT U-Boot: {len(fit)} bytes")
          PY

          partition_json="$(sfdisk -J "$image")"
          sector_size="$(jq -r '.partitiontable.sectorsize' <<<"$partition_json")"
          mapfile -t partition_starts < <(jq -r '.partitiontable.partitions[].start' <<<"$partition_json")
          mapfile -t partition_sizes < <(jq -r '.partitiontable.partitions[].size' <<<"$partition_json")
          if [[ "$sector_size" != 512 || "${#partition_starts[@]}" -ne 2 || \
                "${partition_starts[0]}" != 32768 || "${partition_starts[1]}" != 1081344 ]]; then
            echo "Expected the verified two-partition Armbian layout: BOOT starts at LBA 32768 and ROOTFS at LBA 1081344 (512-byte sectors)." >&2
            echo "A single-rootfs image from the direct source-build workflow is not a valid base for this cooker." >&2
            sfdisk -d "$image" >&2 || true
            exit 1
          fi
          boot_end_lba=$((partition_starts[0] + partition_sizes[0] - 1))
          root_end_lba=$((partition_starts[1] + partition_sizes[1] - 1))
          (( boot_end_lba < partition_starts[1] )) || {
            echo "BOOT and ROOTFS partitions overlap" >&2
            exit 1
          }
          first_start_bytes=$((sector_size * partition_starts[0]))
          test "$first_start_bytes" -ge $((8 * 1024 * 1024 + $(stat -c %s "$fit"))) || {
            echo "First partition starts too early for the verified U-Boot FIT" >&2
            exit 1
          }

          loop="$(sudo losetup --find --show --partscan "$image")"
          cleanup() {
            for path in run sys proc dev; do
              sudo umount -R "$work/mnt/$path" 2>/dev/null || true
            done
            sudo umount "$work/mnt/boot" 2>/dev/null || true
            sudo umount "$work/bootmnt" 2>/dev/null || true
            sudo umount "$work/mnt" 2>/dev/null || true
            sudo losetup -d "$loop" 2>/dev/null || true
          }
          trap cleanup EXIT

          rootpart=""
          while read -r part; do
            [ -b "$part" ] || continue
            if sudo mount "$part" "$work/mnt" 2>/dev/null; then
              if [ -f "$work/mnt/etc/os-release" ] && [ -d "$work/mnt/boot" ]; then
                rootpart="$part"
                break
              fi
              sudo umount "$work/mnt"
            fi
          done < <(lsblk -lnpo NAME "$loop" | tail -n +2)
          test -n "$rootpart" || { echo "Could not find the Armbian root partition" >&2; exit 1; }

          bootpart=""
          while read -r part; do
            [ -b "$part" ] || continue
            [ "$part" = "$rootpart" ] && continue
            if sudo mount "$part" "$work/bootmnt" 2>/dev/null; then
              if [ -f "$work/bootmnt/boot.cmd" ] && [ -f "$work/bootmnt/armbianEnv.txt" ]; then
                bootpart="$part"
                break
              fi
              sudo umount "$work/bootmnt"
            fi
          done < <(lsblk -lnpo NAME "$loop" | tail -n +2)
          test -n "$bootpart" || { echo "Could not find the Armbian BOOT partition" >&2; exit 1; }
          [[ "$bootpart" == "${loop}p1" && "$rootpart" == "${loop}p2" ]] || {
            echo "Expected BOOT as partition 1 and ROOTFS as partition 2" >&2
            exit 1
          }
          grep -Fq '${prefix}Image' "$work/bootmnt/boot.cmd" || {
            echo "boot.cmd does not load Image" >&2
            exit 1
          }
          grep -Fq '${prefix}dtb/${fdtfile}' "$work/bootmnt/boot.cmd" || {
            echo "boot.cmd does not load the fdtfile DTB" >&2
            exit 1
          }

          if [[ "$IMAGE_VARIANT" == "diagnostics" ]]; then
            # Install diagnostics into the ARM64 rootfs without starting its services.
            diag_pass="$(openssl rand -hex 8)"
            sudo cp /usr/bin/qemu-aarch64-static "$work/mnt/usr/bin/"
            policy="$work/mnt/usr/sbin/policy-rc.d"
            if [ -e "$policy" ]; then
              echo "Refusing to overwrite existing policy-rc.d" >&2
              exit 1
            fi
            printf '#!/bin/sh\nexit 101\n' | sudo tee "$policy" >/dev/null
            sudo chmod 0755 "$policy"

            resolv_path="$work/mnt/etc/resolv.conf"
            if [ -e "$resolv_path" ] || [ -L "$resolv_path" ]; then
              sudo cp -a "$resolv_path" "$work/resolv.conf.original"
            fi
            sudo rm -f "$resolv_path"
            sudo cp -L /etc/resolv.conf "$resolv_path"
            grep -Eq "^[[:space:]]*nameserver[[:space:]]+" "$resolv_path" || {
              echo "Runner resolv.conf has no nameserver" >&2
              exit 1
            }

            # Bind pseudo-filesystems so package scripts see the target's /dev/null,
            # /dev/pts and proc/sys interfaces while running inside chroot.
            for path in dev proc sys run; do
              sudo mount --rbind "/$path" "$work/mnt/$path"
              sudo mount --make-rslave "$work/mnt/$path"
            done
            sudo chroot "$work/mnt" /usr/bin/qemu-aarch64-static -L / /usr/bin/apt-get update
            sudo chroot "$work/mnt" /usr/bin/qemu-aarch64-static -L / /usr/bin/apt-get install -y \
              dnsmasq hostapd iproute2 iw python3 rfkill usbutils wireless-regdb
            sudo chroot "$work/mnt" /usr/bin/qemu-aarch64-static -L / /usr/bin/apt-get clean || true
            sudo rm -f "$resolv_path"
            if [ -e "$work/resolv.conf.original" ] || [ -L "$work/resolv.conf.original" ]; then
              sudo cp -a "$work/resolv.conf.original" "$resolv_path"
            fi
            sudo rm -f "$policy" "$work/mnt/usr/bin/qemu-aarch64-static"
            for path in run sys proc dev; do
              sudo umount -R "$work/mnt/$path"
            done

            diag="$GITHUB_WORKSPACE/test-assets/mytvnet1/diagnostics"
            aarch64-linux-gnu-gcc -O2 -Wall -Wextra -std=gnu11 \
              "$diag/panel-progress.c" -o "$work/mytvnet1-panel-progress"
            sudo install -m 0755 "$work/mytvnet1-panel-progress" \
              "$work/mnt/usr/local/sbin/mytvnet1-panel-progress"
            sudo install -D -m 0755 "$diag/capture.sh" \
              "$work/mnt/usr/local/sbin/mytvnet1-diag-capture"
            sudo install -m 0755 "$diag/start-ap.sh" \
              "$work/mnt/usr/local/sbin/mytvnet1-diag-start-ap"
            sudo install -m 0755 "$diag/start-eth-dhcp.sh" \
              "$work/mnt/usr/local/sbin/mytvnet1-diag-start-eth-dhcp"
            sudo install -D -m 0644 "$diag/web.py" \
              "$work/mnt/usr/local/lib/mytvnet1-diag/web.py"
            sudo install -D -m 0644 "$diag/dnsmasq-ap.conf" \
              "$work/mnt/etc/mytvnet1-diag/dnsmasq-ap.conf"
            sudo install -m 0644 "$diag/dnsmasq-eth.conf" \
              "$work/mnt/etc/mytvnet1-diag/dnsmasq-eth.conf"
            sudo install -m 0644 "$diag"/*.service "$work/mnt/etc/systemd/system/"
            sudo install -D -m 0600 /dev/null "$work/mnt/etc/hostapd/mytvnet1-diag.conf"
            sudo tee "$work/mnt/etc/hostapd/mytvnet1-diag.conf" >/dev/null <<EOF
          interface=wlan0
          driver=nl80211
          ctrl_interface=/run/hostapd
          ctrl_interface_group=0
          ssid=MyTVNet1-Diag
          country_code=VN
          ieee80211d=1
          hw_mode=g
          channel=6
          wmm_enabled=1
          auth_algs=1
          wpa=2
          wpa_key_mgmt=WPA-PSK
          rsn_pairwise=CCMP
          wpa_passphrase=$diag_pass
          EOF
            sudo chmod 0600 "$work/mnt/etc/hostapd/mytvnet1-diag.conf"
            sudo systemctl --root="$work/mnt" disable hostapd.service dnsmasq.service 2>/dev/null || true
            sudo systemctl --root="$work/mnt" enable \
              mytvnet1-diag-capture.service mytvnet1-diag-ap.service \
              mytvnet1-diag-ap-dhcp.service mytvnet1-diag-eth-dhcp.service \
              mytvnet1-diag-web.service mytvnet1-diag-final.service \
              mytvnet1-panel-progress.service
            sudo mkdir -p "$work/mnt/var/lib/mytvnet1-diag" "$work/mnt/mnt/mytv-diag"
          fi

          if [[ "$IMAGE_VARIANT" != "baseline" ]]; then
            sudo install -m 0644 "$kernel/boot/Image" "$work/bootmnt/Image"
            sudo install -D -m 0644 \
              "$kernel/boot/dtb/rockchip/rk3528-mytv-net1.dtb" \
              "$work/bootmnt/dtb/rockchip/rk3528-mytv-net1.dtb"
            sudo tar -xzf "$kernel/mytvnet1-modules.tar.gz" -C "$work"
            sudo install -d "$work/mnt/lib/modules"
            sudo cp -a "$work/modules/$release" "$work/mnt/lib/modules/"
            sudo depmod -b "$work/mnt" "$release"

            test -x "$work/mnt/usr/sbin/update-initramfs" || {
              echo "Rootfs lacks initramfs-tools; cannot create an initrd for the custom kernel" >&2
              exit 1
            }
            sudo cp /usr/bin/qemu-aarch64-static "$work/mnt/usr/bin/"
            initramfs_conf="$work/mnt/etc/initramfs-tools/initramfs.conf"
            if grep -q '^COMPRESS=' "$initramfs_conf"; then
              sudo sed -i 's#^COMPRESS=.*#COMPRESS=gzip#' "$initramfs_conf"
            else
              echo 'COMPRESS=gzip' | sudo tee -a "$initramfs_conf" >/dev/null
            fi
            sudo mount --bind "$work/bootmnt" "$work/mnt/boot"
            for path in dev proc sys run; do
              sudo mount --rbind "/$path" "$work/mnt/$path"
              sudo mount --make-rslave "$work/mnt/$path"
            done
            if [ -e "$work/bootmnt/initrd.img-$release" ]; then
              initramfs_action=-u
            else
              initramfs_action=-c
            fi
            sudo chroot "$work/mnt" /usr/bin/qemu-aarch64-static -L / /bin/bash \
              /usr/sbin/update-initramfs "$initramfs_action" -k "$release"
            for path in run sys proc dev; do
              sudo umount -R "$work/mnt/$path"
            done
            sudo umount "$work/mnt/boot"
            sudo rm -f "$work/mnt/usr/bin/qemu-aarch64-static"
            sudo mkimage -A arm64 -O linux -T ramdisk -C gzip \
              -n "MyTV Net 1 initramfs $release" \
              -d "$work/bootmnt/initrd.img-$release" "$work/bootmnt/uInitrd"

            if grep -q '^fdtfile=' "$work/bootmnt/armbianEnv.txt"; then
              sudo sed -i 's#^fdtfile=.*#fdtfile=rockchip/rk3528-mytv-net1.dtb#' \
                "$work/bootmnt/armbianEnv.txt"
            else
              echo 'fdtfile=rockchip/rk3528-mytv-net1.dtb' | \
                sudo tee -a "$work/bootmnt/armbianEnv.txt" >/dev/null
            fi
            if [ -f "$work/bootmnt/extlinux/extlinux.conf" ]; then
              sudo sed -i 's#^[[:space:]]*FDT .*#  FDT /dtb/rockchip/rk3528-mytv-net1.dtb#' \
                "$work/bootmnt/extlinux/extlinux.conf"
            fi
            printf '%s\n' "$release" | \
              sudo tee "$work/bootmnt/mytvnet1-kernelrelease.txt" >/dev/null
          fi


          sync
          sudo umount "$work/bootmnt"
          sudo umount "$work/mnt"
          sudo losetup -d "$loop"
          trap - EXIT

          # Match the verified PowerShell/Ophub Rockchip layout: IDB at LBA 64,
          # then the complete 8 MiB FIT slice at LBA 16384. This image uses those
          # two verified files; no separate TRUST_IMG was present in that source.
          sudo dd if="$idb" of="$image" bs=512 seek=64 conv=notrunc,fsync status=none
          sudo dd if="$fit" of="$image" bs=512 seek=16384 conv=notrunc,fsync status=none
          idb_sectors=$(($(stat -c %s "$idb") / 512))
          fit_sectors=$(($(stat -c %s "$fit") / 512))
          sudo dd if="$image" of="$work/idb.readback" bs=512 skip=64 count="$idb_sectors" status=none
          sudo dd if="$image" of="$work/fit.readback" bs=512 skip=16384 count="$fit_sectors" status=none
          cmp "$idb" "$work/idb.readback"
          cmp "$fit" "$work/fit.readback"

          mkdir -p "$GITHUB_WORKSPACE/test-output"
          image_name="Armbian_MyTV-Net1_${IMAGE_VARIANT}.img.gz"
          gzip -1 "$image"
          mv "$image.gz" "$GITHUB_WORKSPACE/test-output/$image_name"
          (
            cd "$GITHUB_WORKSPACE/test-output"
            sha256sum "$image_name" > SHA256SUMS
          )
          {
            echo "variant=$IMAGE_VARIANT"
            echo "partition_table=gpt"
            echo "boot_start_lba=${partition_starts[0]}"
            echo "boot_end_lba=$boot_end_lba"
            echo "rootfs_start_lba=${partition_starts[1]}"
            echo "rootfs_end_lba=$root_end_lba"
            echo "eMMC_first_10MiB=not included or modified; this workflow only builds an SD-card image"
            echo "idbloader_sha256=$(sha256sum "$idb" | awk '{print $1}')"
            echo "u_boot_fit_sha256=$(sha256sum "$fit" | awk '{print $1}')"
            if [[ "$IMAGE_VARIANT" != "baseline" ]]; then
              echo "kernelrelease=$release"
              echo "kernel_image_sha256=$(sha256sum "$kernel/boot/Image" | awk '{print $1}')"
              echo "mytv_dtb_sha256=$(sha256sum "$kernel/boot/dtb/rockchip/rk3528-mytv-net1.dtb" | awk '{print $1}')"
            fi
          } > "$GITHUB_WORKSPACE/test-output/BUILD-INFO.txt"
          cat > "$GITHUB_WORKSPACE/test-output/FLASH-INSTRUCTIONS.txt" <<'EOF'
          Target: removable SD card only. This workflow does not write to the box's eMMC.

          Keep the existing eMMC contents, including its first 10 MiB, unchanged while testing SD boot. Community reports describe RK3528 TV boxes whose early boot stage reads persistent U-Boot environment from eMMC; the exact behavior can vary by board and factory firmware.

          Do not copy an eMMC first-10-MiB dump over the beginning of this SD image. The dump includes the eMMC GPT and environment and is a recovery/diagnostic backup, not a replacement for the SD image's partition table. The SD image already contains the verified loader files at LBA 64 and LBA 16384.

          This image uses two partitions: BOOT begins at LBA 32768 (16 MiB) and ROOTFS begins at LBA 1081344 (528 MiB), with 512-byte sectors. The verified 8 MiB U-Boot FIT occupies bytes 8 MiB through 16 MiB.
          EOF
          if [[ "$IMAGE_VARIANT" == "diagnostics" ]]; then
            cp "$GITHUB_WORKSPACE/test-assets/mytvnet1/diagnostics/README.md" \
              "$GITHUB_WORKSPACE/test-output/DIAGNOSTICS-README.txt"
            {
              echo "SSID: MyTVNet1-Diag"
              echo "Password: $diag_pass"
              echo "Wi-Fi URL: http://192.168.77.1:8080"
              echo "Optional direct Ethernet: create an empty ENABLE_ETH_DHCP file on the MYTV_DIAG USB, connect laptop directly, then open http://192.168.88.1:8080"
            } > "$GITHUB_WORKSPACE/test-output/DIAGNOSTIC-ACCESS.txt"
          fi

      - name: Upload cooked image artifact
        uses: actions/upload-artifact@v4
        with:
          name: Armbian-MyTV-Net1-${{ matrix.variant }}
          path: test-output/
          if-no-files-found: error
          retention-days: 14
