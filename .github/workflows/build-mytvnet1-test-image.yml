name: Cook MyTV Net 1 test image

on:
  workflow_dispatch:
    inputs:
      base_image_url:
        description: Public URL of the base Armbian .img or .img.gz built by this fork
        required: true
        type: string
      kernel_run_id:
        description: Successful run ID from Build MyTV Net 1 kernel and DTB
        required: true
        type: string
      kernel_ref:
        description: Kernel artifact ref used in the kernel build workflow
        required: true
        default: dev-mytv-net1
        type: string

permissions:
  actions: read
  contents: read

jobs:
  cook:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout AML fork and test bootloader files
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download custom kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: mytvnet1-kernel-${{ inputs.kernel_ref }}
          run-id: ${{ inputs.kernel_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/kernel-artifact

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binfmt-support curl file gcc-aarch64-linux-gnu gzip jq kmod parted qemu-user-static util-linux

      - name: Download and cook image
        shell: bash
        env:
          BASE_IMAGE_URL: ${{ inputs.base_image_url }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mytvnet1-image"
          kernel="$RUNNER_TEMP/kernel-artifact"
          bootloader="$GITHUB_WORKSPACE/test-assets/mytvnet1"
          mkdir -p "$work" "$work/mnt" "$work/bootmnt"

          curl --fail --location --retry 3 "$BASE_IMAGE_URL" -o "$work/base.download"
          if file "$work/base.download" | grep -qi 'gzip compressed'; then
            gzip -dc "$work/base.download" > "$work/Armbian_MyTV-Net1_test.img"
          else
            cp "$work/base.download" "$work/Armbian_MyTV-Net1_test.img"
          fi
          image="$work/Armbian_MyTV-Net1_test.img"

          (
            cd "$kernel"
            sha256sum -c SHA256SUMS
          )
          release="$(cat "$kernel/kernelrelease.txt")"
          idb="$bootloader/idbloader.img"
          fit="$bootloader/u-boot.itb"
          (cd "$bootloader" && sha256sum -c SHA256SUMS)
          test -s "$image"
          test -s "$kernel/boot/Image"
          test -s "$kernel/boot/dtb/rockchip/rk3528-mytv-net1.dtb"
          test -s "$idb"
          test -s "$fit"

          python3 - "$idb" "$fit" <<'PY'
          import pathlib, sys
          idb, fit = (pathlib.Path(p).read_bytes() for p in sys.argv[1:])
          if idb[:4] != b"RKNS":
              raise SystemExit("idbloader.img does not start with RKNS")
          if fit[:4] != bytes.fromhex("d00dfeed"):
              raise SystemExit("u-boot.itb is not a FIT image")
          if len(idb) > 8 * 1024 * 1024 - 32 * 1024:
              raise SystemExit("idbloader.img overlaps the 8 MiB U-Boot FIT slot")
          print(f"IDB loader: {len(idb)} bytes; FIT U-Boot: {len(fit)} bytes")
          PY

          sector_size="$(sfdisk -J "$image" | jq -r '.partitiontable.sectorsize')"
          first_start="$(sfdisk -J "$image" | jq -r '.partitiontable.partitions[0].start')"
          first_start_bytes=$((sector_size * first_start))
          test "$first_start_bytes" -ge $((8 * 1024 * 1024 + $(stat -c %s "$fit"))) || {
            echo "First partition starts too early for the selected U-Boot FIT" >&2
            exit 1
          }

          loop="$(sudo losetup --find --show --partscan "$image")"
          cleanup() {
            sudo umount "$work/bootmnt" 2>/dev/null || true
            sudo umount "$work/mnt" 2>/dev/null || true
            sudo losetup -d "$loop" 2>/dev/null || true
          }
          trap cleanup EXIT

          rootpart=""
          while read -r part; do
            [ -b "$part" ] || continue
            if sudo mount "$part" "$work/mnt" 2>/dev/null; then
              if [ -f "$work/mnt/etc/os-release" ] && [ -d "$work/mnt/boot" ]; then
                rootpart="$part"
                break
              fi
              sudo umount "$work/mnt"
            fi
          done < <(lsblk -lnpo NAME "$loop" | tail -n +2)
          test -n "$rootpart" || { echo "Could not find the Armbian root partition" >&2; exit 1; }

          # The Armbian rootfs has a separate /boot partition. Locate the
          # partition containing boot.cmd and armbianEnv.txt; U-Boot reads
          # Image and dtb from this filesystem, not rootfs/boot.
          bootpart=""
          while read -r part; do
            [ -b "$part" ] || continue
            [ "$part" = "$rootpart" ] && continue
            if sudo mount "$part" "$work/bootmnt" 2>/dev/null; then
              if [ -f "$work/bootmnt/boot.cmd" ] && [ -f "$work/bootmnt/armbianEnv.txt" ]; then
                bootpart="$part"
                break
              fi
              sudo umount "$work/bootmnt"
            fi
          done < <(lsblk -lnpo NAME "$loop" | tail -n +2)
          test -n "$bootpart" || { echo "Could not find the Armbian BOOT partition" >&2; exit 1; }
          grep -Fq '${prefix}Image' "$work/bootmnt/boot.cmd" || {
            echo "boot.cmd does not load the expected Image file" >&2
            exit 1
          }
          grep -Fq '${prefix}dtb/${fdtfile}' "$work/bootmnt/boot.cmd" || {
            echo "boot.cmd does not load the DTB selected by fdtfile" >&2
            exit 1
          }

          # Add diagnostic packages to the ARM64 rootfs while cooking, so the
          # first boot does not need working Ethernet to start the AP/web UI.
          diag_pass="$(openssl rand -hex 8)"
          sudo cp /usr/bin/qemu-aarch64-static "$work/mnt/usr/bin/"
          policy="$work/mnt/usr/sbin/policy-rc.d"
          if [ -e "$policy" ]; then
            echo "Refusing to overwrite existing policy-rc.d" >&2
            exit 1
          fi
          printf '#!/bin/sh\nexit 101\n' | sudo tee "$policy" >/dev/null
          sudo chmod 0755 "$policy"
          # Make the runner DNS resolver visible inside the offline ARM64 rootfs chroot.
          resolv_path="$work/mnt/etc/resolv.conf"
          if [ -e "$resolv_path" ] || [ -L "$resolv_path" ]; then
            sudo cp -a "$resolv_path" "$work/resolv.conf.original"
          fi
          sudo rm -f "$resolv_path"
          sudo cp -L /etc/resolv.conf "$resolv_path"
          grep -Eq "^[[:space:]]*nameserver[[:space:]]+" "$resolv_path" || {
            echo "Runner resolv.conf has no nameserver" >&2
            exit 1
          }
          sudo chroot "$work/mnt" /usr/bin/qemu-aarch64-static -L / /usr/bin/apt-get update
          sudo chroot "$work/mnt" /usr/bin/qemu-aarch64-static -L / /usr/bin/apt-get install -y dnsmasq hostapd iproute2 iw python3 rfkill usbutils wireless-regdb
          sudo chroot "$work/mnt" /usr/bin/qemu-aarch64-static -L / /usr/bin/apt-get clean || true
          sudo rm -f "$resolv_path"
          if [ -e "$work/resolv.conf.original" ] || [ -L "$work/resolv.conf.original" ]; then
            sudo cp -a "$work/resolv.conf.original" "$resolv_path"
          fi
          sudo rm -f "$policy" "$work/mnt/usr/bin/qemu-aarch64-static"

          diag="$GITHUB_WORKSPACE/test-assets/mytvnet1/diagnostics"
          aarch64-linux-gnu-gcc -O2 -Wall -Wextra -std=gnu11 "$diag/panel-progress.c" -o "$work/mytvnet1-panel-progress"
          sudo install -m 0755 "$work/mytvnet1-panel-progress" "$work/mnt/usr/local/sbin/mytvnet1-panel-progress"
          sudo install -D -m 0755 "$diag/capture.sh" "$work/mnt/usr/local/sbin/mytvnet1-diag-capture"
          sudo install -m 0755 "$diag/start-ap.sh" "$work/mnt/usr/local/sbin/mytvnet1-diag-start-ap"
          sudo install -m 0755 "$diag/start-eth-dhcp.sh" "$work/mnt/usr/local/sbin/mytvnet1-diag-start-eth-dhcp"
          sudo install -D -m 0644 "$diag/web.py" "$work/mnt/usr/local/lib/mytvnet1-diag/web.py"
          sudo install -D -m 0644 "$diag/dnsmasq-ap.conf" "$work/mnt/etc/mytvnet1-diag/dnsmasq-ap.conf"
          sudo install -m 0644 "$diag/dnsmasq-eth.conf" "$work/mnt/etc/mytvnet1-diag/dnsmasq-eth.conf"
          sudo install -m 0644 "$diag/mytvnet1-diag-capture.service" "$work/mnt/etc/systemd/system/"
          sudo install -m 0644 "$diag/mytvnet1-diag-ap.service" "$work/mnt/etc/systemd/system/"
          sudo install -m 0644 "$diag/mytvnet1-diag-ap-dhcp.service" "$work/mnt/etc/systemd/system/"
          sudo install -m 0644 "$diag/mytvnet1-diag-eth-dhcp.service" "$work/mnt/etc/systemd/system/"
          sudo install -m 0644 "$diag/mytvnet1-diag-web.service" "$work/mnt/etc/systemd/system/"
          sudo install -m 0644 "$diag/mytvnet1-diag-final.service" "$work/mnt/etc/systemd/system/"
          sudo install -m 0644 "$diag/mytvnet1-panel-progress.service" "$work/mnt/etc/systemd/system/"
          sudo install -D -m 0600 /dev/null "$work/mnt/etc/hostapd/mytvnet1-diag.conf"
          sudo tee "$work/mnt/etc/hostapd/mytvnet1-diag.conf" >/dev/null <<EOF
          interface=wlan0
          driver=nl80211
          ctrl_interface=/run/hostapd
          ctrl_interface_group=0
          ssid=MyTVNet1-Diag
          country_code=VN
          ieee80211d=1
          hw_mode=g
          channel=6
          wmm_enabled=1
          auth_algs=1
          wpa=2
          wpa_key_mgmt=WPA-PSK
          rsn_pairwise=CCMP
          wpa_passphrase=$diag_pass
          EOF
          sudo chmod 0600 "$work/mnt/etc/hostapd/mytvnet1-diag.conf"
          sudo systemctl --root="$work/mnt" disable hostapd.service dnsmasq.service 2>/dev/null || true
          sudo systemctl --root="$work/mnt" enable mytvnet1-diag-capture.service mytvnet1-diag-ap.service mytvnet1-diag-ap-dhcp.service mytvnet1-diag-eth-dhcp.service mytvnet1-diag-web.service mytvnet1-diag-final.service mytvnet1-panel-progress.service
          sudo mkdir -p "$work/mnt/var/lib/mytvnet1-diag" "$work/mnt/mnt/mytv-diag"

          sudo install -m 0644 "$kernel/boot/Image" "$work/bootmnt/Image"
          sudo install -D -m 0644 \
            "$kernel/boot/dtb/rockchip/rk3528-mytv-net1.dtb" \
            "$work/bootmnt/dtb/rockchip/rk3528-mytv-net1.dtb"
          sudo cmp "$kernel/boot/Image" "$work/bootmnt/Image"
          sudo cmp "$kernel/boot/dtb/rockchip/rk3528-mytv-net1.dtb" \
            "$work/bootmnt/dtb/rockchip/rk3528-mytv-net1.dtb"
          sudo tar -xzf "$kernel/mytvnet1-modules.tar.gz" -C "$work"
          sudo install -d "$work/mnt/lib/modules"
          sudo cp -a "$work/modules/$release" "$work/mnt/lib/modules/"
          sudo depmod -b "$work/mnt" "$release"

          if grep -q '^fdtfile=' "$work/bootmnt/armbianEnv.txt"; then
            sudo sed -i 's#^fdtfile=.*#fdtfile=rockchip/rk3528-mytv-net1.dtb#' \
              "$work/bootmnt/armbianEnv.txt"
          else
            echo 'fdtfile=rockchip/rk3528-mytv-net1.dtb' | \
              sudo tee -a "$work/bootmnt/armbianEnv.txt" >/dev/null
          fi
          if [ -f "$work/bootmnt/extlinux/extlinux.conf" ]; then
            sudo sed -i 's#^[[:space:]]*FDT .*#  FDT /dtb/rockchip/rk3528-mytv-net1.dtb#' \
              "$work/bootmnt/extlinux/extlinux.conf"
          fi
          printf '%s\n' "$release" | sudo tee "$work/bootmnt/mytvnet1-kernelrelease.txt" >/dev/null
          sync
          sudo umount "$work/bootmnt"
          sudo umount "$work/mnt"
          sudo losetup -d "$loop"
          trap - EXIT

          # RK3528 BootROM layout used by the known-good cooking_img files:
          # idbloader at sector 64 (32 KiB), U-Boot FIT at sector 16384 (8 MiB).
          sudo dd if="$idb" of="$image" bs=512 seek=64 conv=notrunc,fsync status=none
          sudo dd if="$fit" of="$image" bs=512 seek=16384 conv=notrunc,fsync status=none
          sha256sum "$image" "$idb" "$fit" "$kernel/boot/dtb/rockchip/rk3528-mytv-net1.dtb" \
            | tee "$work/SHA256SUMS"
          gzip -1 "$image"
          mkdir -p "$GITHUB_WORKSPACE/test-output"
          mv "$image.gz" "$GITHUB_WORKSPACE/test-output/Armbian_MyTV-Net1_custom-kernel-uboot.img.gz"
          cp "$work/SHA256SUMS" "$GITHUB_WORKSPACE/test-output/SHA256SUMS"
          cp "$GITHUB_WORKSPACE/test-assets/mytvnet1/diagnostics/README.md" "$GITHUB_WORKSPACE/test-output/DIAGNOSTICS-README.txt"
          {
            echo "SSID: MyTVNet1-Diag"
            echo "Password: $diag_pass"
            echo "Wi-Fi URL: http://192.168.77.1:8080"
            echo "Optional direct Ethernet: create an empty ENABLE_ETH_DHCP file on the MYTV_DIAG USB, connect laptop directly, then open http://192.168.88.1:8080"
          } > "$GITHUB_WORKSPACE/test-output/DIAGNOSTIC-ACCESS.txt"

      - name: Upload cooked test image
        uses: actions/upload-artifact@v4
        with:
          name: Armbian-MyTV-Net1-custom-kernel-uboot
          path: test-output/
          if-no-files-found: error
          retention-days: 14
