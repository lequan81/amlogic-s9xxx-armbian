#==========================================================================
# Description: Compile custom Rockchip RK3528 kernel
# Repository: https://github.com/lequan81/linux-6.1.y-rockchip
#==========================================================================

name: Compile the kernel

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: "Select the kernel source"
        required: false
        # Trỏ thẳng về nhánh DTS chuẩn của bạn (đã an toàn 100%)
        default: "lequan81/linux-6.1.y-rockchip@rk3528-mytv-net1"
        type: string
      kernel_version:
        description: "Select kernel version"
        required: false
        default: "6.1.y"
        type: choice
        options:
          - 6.1.y
      kernel_auto:
        description: "Auto use the latest kernel"
        required: false
        default: false
        type: boolean
      delete_source:
        description: "Delete source after compilation"
        required: false
        default: true
        type: boolean
      kernel_package:
        description: "Select compile package list"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - dtbs
      kernel_toolchain:
        description: "Select the compilation toolchain"
        required: false
        default: "gcc"
        type: choice
        options:
          - gcc
          - clang
      ccache_clear:
        description: "Set whether to clear the cache"
        required: false
        default: false
        type: boolean
      docker_image:
        description: "Select Armbian docker image"
        required: false
        default: "bookworm"
        type: choice
        options:
          - bookworm
          - resolute
          - noble
      kernel_sign:
        description: "Set the kernel custom signature"
        required: false
        default: "-mytv"
        type: string

env:
  TZ: Etc/UTC

jobs:
  setup:
    runs-on: ubuntu-26.04-arm
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set build matrix based on kernel_version input
        id: set-matrix
        run: |
          MATRIX='{"include":[{"kernel_version":"${{ inputs.kernel_version || '6.1.y' }}"}]}'
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  build:
    needs: setup
    runs-on: ubuntu-26.04-arm
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    name: compile-kernel-${{ matrix.kernel_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize the build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2604-build-armbian-depends)
          sudo systemctl daemon-reload
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
          sudo ntpdate ntp.ubuntu.com 0.pool.ntp.org || true
          sudo timedatectl set-ntp true
          date -u
          timedatectl status || true
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create virtual disk for extended storage
        id: disk
        run: |
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: Insufficient space on /: ${root_avail}G available"; exit 1; }

          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          echo "Using /: ${root_size}G"

          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder

          # 1. Khắc phục lỗi lệch đường dẫn compile-kernel của Ophub
          mkdir -p /builder/output
          ln -sfn . /builder/compile-kernel

          df -Th
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Get kernel source commit hash
        id: kernelhash
        run: |
          api_url="https://api.github.com/repos/lequan81/linux-6.1.y-rockchip/git/ref/heads/rk3528-mytv-net1"
          source_hash=$(curl -fsSL -m 20 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "${api_url}" | jq -r '.object.sha'
          )
          [[ -z "${source_hash}" || "${source_hash}" == "null" ]] && source_hash="${{ github.sha }}"
          echo "source_hash=${source_hash}" >> ${GITHUB_ENV}
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /builder/ccache
          key: kernel-${{ inputs.kernel_toolchain }}-${{ matrix.kernel_version }}-${{ env.source_hash }}
          restore-keys: |
            kernel-${{ inputs.kernel_toolchain }}-${{ matrix.kernel_version }}-

      # 2. Vá regex để nhận diện cả số và chữ (6.1.y), loại bỏ lỗi exit code 1 ở phút cuối
      - name: Patch Ophub regex for 6.1.y support
        run: |
          action_file="/home/runner/work/_actions/ophub/amlogic-s9xxx-armbian/main/action.yml"
          if [ -f "${action_file}" ]; then
            sed -i 's/\\d+\\.\\d+\\.\\d+/\\d+\\.\\d+\\.\\w+/g' "${action_file}"
            echo "Đã vá regex thành công:"
            grep -n "grep -oP" "${action_file}" || true
          fi

      - name: Compile the kernel [ ${{ matrix.kernel_version }} ]
        uses: ophub/amlogic-s9xxx-armbian@main
        if: ${{ steps.disk.outputs.status == 'success' && !cancelled() }}
        with:
          build_target: kernel
          kernel_source: ${{ inputs.kernel_source }}
          kernel_version: ${{ inputs.kernel_version }}
          kernel_auto: ${{ inputs.kernel_auto }}
          delete_source: ${{ inputs.delete_source }}
          kernel_package: ${{ inputs.kernel_package }}
          kernel_sign: ${{ inputs.kernel_sign }}
          kernel_toolchain: ${{ inputs.kernel_toolchain }}
          ccache_clear: ${{ inputs.ccache_clear }}
          docker_hostpath: /builder
          docker_image: ophub/armbian-${{ inputs.docker_image }}:arm64
          # 3. Nạp trực tiếp file config-6.1 chuẩn Rockchip bạn vừa commit
          kernel_config: compile-kernel/tools/config

      # 4. Gom tất cả file .deb và .tar.gz từ thư mục con ra ngoài để Release nhận diện
      - name: Prepare artifacts for release
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        run: |
          cd /builder/output
          find . -mindepth 2 -type f \( -name "*.deb" -o -name "*.tar.gz" \) -exec cp -fv {} . \;
          echo "Danh sách các gói build hoàn chỉnh:"
          ls -lh *.deb *.tar.gz 2>/dev/null || true

      - name: Upload Kernel to Release
        uses: ophub/upload-to-releases@main
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: kernel_rk35xx
          artifacts: /builder/output/*.*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: false
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            - Custom Linux Kernel for RK3528 (VNPT MyTV Net 1).
            - Compiled from repository: [lequan81/linux-6.1.y-rockchip](https://github.com/lequan81/linux-6.1.y-rockchip/tree/rk3528-mytv-net1).
