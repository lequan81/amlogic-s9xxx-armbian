# MyTV Net 1 uses the matching 6.1 BSP kernel branch that contains the board DTS.
if [[ "${BRANCH}" == "vendor" ]]; then
	declare -g KERNEL_MAJOR_MINOR="6.1"
	declare -g KERNELSOURCE="https://github.com/lequan81/linux-6.1.y-rockchip.git"
	declare -g KERNELBRANCH="branch:dev-mytv-net1"
	declare -g KERNELPATCHDIR="mytvnet1-vendor-6.1"
	declare -g LINUXFAMILY="rk35xx"
	declare -g LINUXCONFIG="linux-rk35xx-vendor"
	declare -g -i KERNEL_GIT_CACHE_TTL=1
fi
