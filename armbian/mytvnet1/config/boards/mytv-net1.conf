# VNPT MyTV Net 1, Rockchip RK3528, 4 GiB DDR4.
BOARD_NAME="MyTV Net 1"
BOARD_VENDOR="VNPT"
BOARDFAMILY="rk35xx"
BOARD_MAINTAINER="lequan81"
INTRODUCED="2023"
BOOTCONFIG="rock-2-rk3528_defconfig"
KERNEL_TARGET="vendor"
KERNEL_TEST_TARGET="vendor"
LINUXFAMILY="rk35xx"
LINUXCONFIG="linux-rk35xx-vendor"
BOOT_FDT_FILE="rockchip/rk3528-mytv-net1.dtb"
BOOT_SCENARIO="spl-blobs"
IMAGE_PARTITION_TABLE="gpt"
SERIALCON="ttyS0:1500000"
FULL_DESKTOP="no"
HAS_VIDEO_OUTPUT="no"
SKIP_BOOTSPLASH="yes"

# Use the RK3528 build recipe from Armbian's Rock 2F board. The final image
# replaces its generic IDB/FIT with this box's verified DDR V1.05 loader pair.
DDR_BLOB="rk35/rk3528_ddr_1056MHz_v1.14.bin"
BL31_BLOB="rk35/rk3528_bl31_v1.21.elf"

BOOTFS_TYPE="fat"
BOOTSIZE="512"
